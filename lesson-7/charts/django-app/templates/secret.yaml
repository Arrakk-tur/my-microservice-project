apiVersion: v1
kind: Secret
metadata:
  name: {{ include "django-app.fullname" . }}-secrets
  labels:
    {{- include "django-app.labels" . | nindent 4 }}
type: Opaque
data:
  SECRET_KEY: {{ .Values.secrets.secretKey | b64enc | quote }}
  DATABASE_PASSWORD: {{ .Values.secrets.dbPassword | b64enc | quote }}