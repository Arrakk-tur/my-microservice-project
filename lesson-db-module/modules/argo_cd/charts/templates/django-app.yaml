apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: django-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/your-user/your-monorepo.git"
    targetRevision: HEAD
    path: "charts/django-app" # Шлях до чарту в монорепозиторії
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true