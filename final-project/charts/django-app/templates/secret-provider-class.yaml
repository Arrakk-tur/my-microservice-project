apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "django-app.fullname" . }}-aws-secrets
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "django-app-secrets-v3" # Назва з Terraform
        objectType: "secretsmanager"
        jmesPath:
          - path: "SECRET_KEY"
            objectAlias: "SECRET_KEY"
          - path: "DATABASE_PASSWORD"
            objectAlias: "DATABASE_PASSWORD"
          - path: "DATABASE_HOST"
            objectAlias: "DATABASE_HOST"
          - path: "DATABASE_USER"
            objectAlias: "DATABASE_USER"
          - path: "DATABASE_NAME"
            objectAlias: "DATABASE_NAME"
          - path: "DATABASE_PORT"
            objectAlias: "DATABASE_PORT"
  # Ця секція створює звичайний K8s Secret із завантажених даних
  secretObjects:
    - secretName: {{ include "django-app.fullname" . }}-synced-secrets
      type: Opaque
      data:
        - objectName: "SECRET_KEY"
          key: "SECRET_KEY"
        - objectName: "DATABASE_PASSWORD"
          key: "DATABASE_PASSWORD"
        - objectName: "DATABASE_HOST"
          key: "DATABASE_HOST"
        - objectName: "DATABASE_USER"
          key: "DATABASE_USER"
        - objectName: "DATABASE_NAME"
          key: "DATABASE_NAME"
        - objectName: "DATABASE_PORT"
          key: "DATABASE_PORT"